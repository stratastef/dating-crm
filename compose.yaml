x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
    TOKEN_VAULT_MASTER_KEY: ${TOKEN_VAULT_MASTER_KEY:-}
    CONNECTOR_DISABLED_CAPABILITIES: ${CONNECTOR_DISABLED_CAPABILITIES:-}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app # local development only
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    <<: *app
    # Migrations run on every API start.
    command: sh -c "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: python -m app.worker
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
