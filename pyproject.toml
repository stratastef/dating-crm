[project]
name = "dating-crm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx[http2]>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: no formatter is enforced yet. B904: routes turn lookup errors into HTTPException on purpose.
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported by name and then shadowed by the test's parameter
"tests/*" = ["F811"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads these calls in argument defaults at import time
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.pyright]
include = ["app"]
